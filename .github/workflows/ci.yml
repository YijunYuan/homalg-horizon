name: CI
on:
  push:
    branches: [main, homalg]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run python scripts/version.py --check
      - run: uv run pytest -q
  wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/archon_horizon/frontend/package-lock.json
      - run: npm --prefix src/archon_horizon/frontend ci
      - run: npx tsc --noEmit
        working-directory: src/archon_horizon/frontend
      - run: npm --prefix src/archon_horizon/frontend test
      - run: npm --prefix src/archon_horizon/frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: src/archon_horizon/frontend
      - run: npm --prefix src/archon_horizon/frontend run test:e2e
      - run: uv build
      - run: uv run python scripts/check_wheel.py
