name: Release HomAlg wheel
on:
  push:
    tags: ['v*-homalg.*']
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/archon_horizon/frontend/package-lock.json
      - run: uv sync --locked --extra dev
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python -c 'import os; from archon_horizon import __version__; from archon_horizon.core.releases import release_version; assert release_version(os.environ["RELEASE_TAG"]) == __version__'
          uv run python scripts/version.py --check
      - run: uv run pytest -q
      - run: npm --prefix src/archon_horizon/frontend ci
      - run: npx tsc --noEmit
        working-directory: src/archon_horizon/frontend
      - run: npm --prefix src/archon_horizon/frontend test
      - run: npm --prefix src/archon_horizon/frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: src/archon_horizon/frontend
      - run: npm --prefix src/archon_horizon/frontend run test:e2e
      - run: uv build
      - run: uv run python scripts/check_wheel.py
      - name: Attach distributions to tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --verify-tag --generate-notes --title "$RELEASE_TAG"
