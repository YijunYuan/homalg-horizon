[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "archon-horizon"
dynamic = ["version"]
description = "Workspace-first orchestration for long-horizon Lean formalization agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Axel Delaval" }]
keywords = ["lean", "lean4", "formalization", "agents", "orchestration", "mathlib"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "PyYAML>=6",
    "typer>=0.12",
    # Imported directly by the CLI (custom help formatter, exception handling);
    # declared explicitly rather than relied on as a Typer transitive dep.
    "click>=8.1",
    "rich>=13",
    "pyfiglet>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/YijunYuan/homalg-horizon"
Repository = "https://github.com/YijunYuan/homalg-horizon"
Changelog = "https://github.com/YijunYuan/homalg-horizon/blob/main/docs/CHANGELOG.md"
Issues = "https://github.com/YijunYuan/homalg-horizon/issues"

[project.scripts]
# Thin entry: ``agent-hook-fast`` bypasses the full Typer CLI import so engine
# lifecycle hooks stay cheap on every tool boundary.
horizon = "archon_horizon.__main__:main"

# include-package-data is intentionally OFF: it sweeps the whole package tree,
# which pulled hundreds of ``frontend/node_modules`` files into the wheel. We
# enumerate exactly what ships via package-data below instead.
[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
# Single source of truth: the version lives in archon_horizon.__version__.
version = { attr = "archon_horizon.__version__" }

[tool.setuptools.package-data]
# Non-.py data we ship: skill + subagent-descriptor markdown, and the built
# dashboard assets (the frontend *source* and node_modules are excluded).
"archon_horizon" = [
    "skills/**/*.md",
    "subagents/**/*.md",
    "hgraph/*.md",
    "frontend/dist/**/*",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["archon_horizon*"]
# Never treat the frontend toolchain tree as importable packages (katex ships
# loose .py build scripts that setuptools would otherwise sweep into the wheel).
exclude = ["archon_horizon.frontend*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
